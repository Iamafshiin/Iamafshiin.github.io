name: افشین حسنی

site:
  title: افشین حسنی — مهندس نرم‌افزار بک‌اند | متخصص سیستم‌های مالی، پرداخت و اعتبار
  description: بیش از ۶ سال است که در زمینه توسعه نرم‌افزارهای بک‌اند فعالیت می‌کنم و تمرکزم روی طراحی و پیاده‌سازی سیستم‌های مالی، زیرساخت‌های پرداخت، کیف پول و اعتباردهی است.

hero:
  hello: افشین حسنی
  lead: مهندس نرم‌افزار بک‌اند
  highlight: متخصص سیستم‌های مالی، پرداخت و اعتبار
  highlight_block: true
  greeting: سلام، من افشین هستم.
  sub:
    - بیش از ۶ سال است که در زمینه توسعه نرم‌افزارهای بک‌اند فعالیت می‌کنم و تمرکزم روی طراحی و پیاده‌سازی سیستم‌های مالی، زیرساخت‌های پرداخت، کیف پول و اعتباردهی است.
    - من روی بخش‌هایی از نرم‌افزار کار می‌کنم که شاید کاربران مستقیماً نبینند، اما عملکرد صحیح کل محصول به آن‌ها وابسته است؛ از مدیریت موجودی و پردازش تراکنش‌ها گرفته تا ارتباط با بانک‌ها و جلوگیری از پرداخت‌های تکراری.
    - هدفم ساخت سیستم‌هایی است که حتی در شرایط پیچیده و پرترافیک، دقیق، پایدار و قابل اعتماد باقی بمانند.
  facts:
    - value: بیش از ۶ سال
      label: تجربه توسعه بک‌اند
    - value: بیش از ۷٬۰۰۰
      label: فروشگاه همکار در محصول اقساطی
    - value: کارشناسی ارشد
      label: مهندسی نرم‌افزار

payment_flow:
  heading: پشت هر پرداخت موفق، یک بک‌اند قابل اعتماد قرار دارد
  intro: "وقتی کاربر دکمه پرداخت را لمس می‌کند، مجموعه‌ای از عملیات باید با دقت و هماهنگی انجام شوند:"
  steps:
    - بررسی موجودی و اعتبار کاربر
    - اطمینان از تکراری نبودن درخواست پرداخت
    - ارتباط با بانک یا سرویس پرداخت در صورت نیاز
    - ثبت دقیق تراکنش در سیستم مالی
    - اطمینان از صحت نتیجه و وضعیت نهایی پرداخت
  outro:
    - تمام این مراحل باید به‌درستی مدیریت شوند؛ حتی اگر ارتباط با سرویس‌های خارجی قطع شود، درخواست دوباره ارسال شود یا چند عملیات هم‌زمان اتفاق بیفتند.
    - این همان بخشی از مهندسی نرم‌افزار است که تمرکز اصلی من روی آن قرار دارد.

explainer:
  heading: حوزه‌هایی که در آن‌ها فعالیت می‌کنم
  items:
    - icon: pay
      title: سیستم‌های پرداخت و مدیریت تراکنش
      text: طراحی و توسعه زیرساخت‌های پرداخت، کیف پول و انتقال وجه با تمرکز بر صحت تراکنش‌ها، جلوگیری از ثبت عملیات تکراری و مدیریت هم‌زمانی درخواست‌ها.
    - icon: loan
      title: سیستم‌های اعتباردهی و خرید اقساطی
      text: پیاده‌سازی چرخه کامل اعتباردهی؛ از محاسبه سقف اعتبار و ثبت درخواست گرفته تا اعتبارسنجی، مدیریت اقساط و پیگیری بازپرداخت.
    - icon: bank
      title: یکپارچه‌سازی با سرویس‌های مالی
      text: طراحی و توسعه ارتباط با بانک‌ها، کارگزاری‌ها و سرویس‌های مالی از طریق API؛ همراه با مدیریت خطا، Timeout، تلاش مجدد و هماهنگی وضعیت تراکنش‌ها.

proof_points:
  - slug: carbon-collateral-credit
    fact: "۴"
    fact_label: کارگزاری متصل‌شده
  - slug: gsmpay-bnpl
    fact: بیش از ۷٬۰۰۰
    fact_label: فروشگاه همکار
  - slug: money-movement
    extra: تمرکز اصلی این بخش، حفظ صحت موجودی حساب‌ها و اطمینان از ثبت صحیح اثر مالی هر عملیات است.
    fact: ""
    fact_label: تمرکز بر Idempotency، Database Locking و تراکنش‌های اتمیک

wins:
  - value: بهینه‌سازی عملکرد گزارش‌ها
    text: در Changino با بازنویسی و بهینه‌سازی کوئری‌های پایگاه داده، زمان اجرای برخی گزارش‌ها را از چند دقیقه به چند ثانیه کاهش دادم.
  - value: ابزارهای عملیاتی برای تیم‌های مالی
    text: توسعه گزارش‌ها و خروجی‌های Excel در پنل مدیریت GSMPay که به‌صورت روزانه توسط تیم‌های مالی و عملیات استفاده می‌شوند.
  - value: مانیتورینگ و هشدار هوشمند
    text: پیاده‌سازی مانیتورینگ با Prometheus در Carbon و تنظیم هشدارهای Slack برای شناسایی زودهنگام کاهش اعتبار قابل تخصیص.
  - value: توسعه و مستندسازی API
    text: طراحی و پیاده‌سازی بیش از ۴۰ API برای اپلیکیشن مشتریان، فروشگاه‌ها و درگاه پرداخت GSMPay، همراه با مستندسازی Swagger و تست‌های مرتبط.

