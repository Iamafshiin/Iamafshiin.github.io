  Changino:
    name: Changino
    position: Backend Developer
    note: توسعه و نگهداری وب‌اپلیکیشن‌ها، بهینه‌سازی عملکرد پایگاه داده و بهبود سرعت اجرای گزارش‌های سیستمی.
  MihanService:
    name: MihanService
    position: Full Stack Developer
    note: توسعه و بازطراحی بخش‌هایی از یک سیستم نرم‌افزاری قدیمی با هدف بهبود ساختار کد و افزایش کارایی.

