# Persian version of portfolio.yaml. Same structure; `site` values not set here come from ../portfolio.yaml.
name: افشین حسنی

site:
  title: افشین حسنی — برنامه‌نویس بک‌اند، پرداخت و اعتبار
  description: افشین حسنی، برنامه‌نویس ارشد بک‌اند با بیش از ۶ سال سابقه در ساخت سیستم‌های پرداخت، اعتبار و خرید اقساطی در فین‌تک.

hero:
  hello: سلام، من افشین هستم.
  lead: "برنامه‌نویس بک‌اند هستم و سیستم‌های "
  highlight: پرداخت، اعتبار و خرید اقساطی را می‌سازم.
  sub: کاربر فقط صفحهٔ اپ را می‌بیند؛ کار من بخشی است که بعد از زدن دکمهٔ «پرداخت» اجرا می‌شود — چک کردن موجودی، استعلام از بانک، و ثبت درست هر تراکنش.
  facts:
    - value: بیش از ۶ سال
      label: سابقه در بک‌اند سیستم‌های مالی
    - value: بیش از ۷٬۰۰۰
      label: فروشگاه همکار در سیستم اقساطی که روی آن کار کردم
    - value: کارشناسی ارشد
      label: مهندسی نرم‌افزار

explainer:
  heading: کار من، به زبان ساده
  analogy: "هر اپ دو بخش دارد: فرانت‌اند، یعنی صفحه‌هایی که کاربر می‌بیند؛ و بک‌اند، یعنی سرور و منطقی که پشت آن صفحه‌ها کار می‌کند. من بک‌اند می‌نویسم — بخشی که کاربر نمی‌بیند، ولی درست کار کردن پول و اطلاعاتش به آن بستگی دارد."
  items:
    - icon: pay
      title: پرداخت
      text: کیف پول، درگاه پرداخت و تراکنش‌هایی که دقیقاً یک بار ثبت می‌شوند؛ نه گم می‌شوند، نه دو بار کسر می‌شوند.
    - icon: loan
      title: اعتبار و اقساط
      text: محاسبهٔ سقف اعتبار، تقسیم آن به اقساط ماهانه، و پیگیری پرداخت تک‌تک قسط‌ها.
    - icon: bank
      title: اتصال به بانک‌ها و کارگزاری‌ها
      text: اتصال به API بانک‌ها و کارگزاری‌ها برای استعلام و ثبت سفارش، تا کاربر نه فرم پر کند و نه در صف بماند.

proof_points:
  - slug: carbon-collateral-credit
    title: قدرت خرید با پشتوانهٔ طلا، نقره و رمزارز
    companies: [Carbon OS]
    period: ۲۰۲۶ – اکنون
    role: کل سیستم اعتبار را از صفر تا صد طراحی کردم و ساختم.
    fact: "۴"
    fact_label: کارگزاری متصل شده
    mockup: credit
    image: /assets/work/carbon-app.webp
    image_w: 253
    image_h: 315
    image_alt: "اپ Carbon: پرداخت به فروشگاه هم‌زمان از کیف نقدی، کیف سرمایه‌گذاری و اعتبار ماهانه"
    image_caption: "اپ Carbon — تصویر از سایت carbon.ir"
  - slug: gsmpay-bnpl
    title: خرید اقساطی (BNPL)
    companies: [GSMPay]
    period: ۲۰۲۴ – ۲۰۲۶
    role: هستهٔ اصلی فرایند وام را ساختم — ثبت درخواست، تأیید بانک، جدول اقساط و قرارداد.
    fact: بیش از ۷٬۰۰۰
    fact_label: فروشگاه همکار
    mockup: installments
    image: /assets/work/gsmpay-credit.webp
    image_w: 358
    image_h: 855
    image_alt: "درخواست اعتبار در GSMPay: انتخاب مبلغ، دورهٔ ۱۲ یا ۲۴ ماهه و بانک، و دیدن مبلغ هر قسط"
    image_caption: "درخواست اعتبار در GSMPay — تصویر از سایت gsmpay.ir"
  - slug: money-movement
    title: جلوگیری از پرداخت تکراری
    companies: [Carbon OS, GSMPay]
    period: ۲۰۲۴ – اکنون
    role: مکانیزم‌هایی را ساختم که جلوی پرداخت تکراری و خطای هم‌زمانی را در پرداخت‌های کیف پول هر دو شرکت می‌گیرد.
    fact: فقط ۱ بار
    fact_label: هر تراکنش دقیقاً یک بار ثبت می‌شود
    mockup: once

wins:
  - value: از دقیقه به ثانیه
    text: کوئری‌های گزارش‌گیری را در Changino بازنویسی کردم تا گزارش‌ها به‌جای چند دقیقه، در چند ثانیه آماده شوند.
  - value: استفادهٔ هرروزه
    text: تیم‌های مالی و عملیات GSMPay هر روز از گزارش‌ها و خروجی‌های Excel پنل ادمینی که ساختم استفاده می‌کنند.
  - value: هشدار زودهنگام
    text: در Carbon با Prometheus مانیتورینگ گذاشتم تا قبل از اینکه اعتبار قابل تخصیص کم شود، تیم در Slack هشدار بگیرد.
  - value: بیش از ۴۰
    text: API برای اپ مشتری، اپ فروشگاه و درگاه پرداخت GSMPay — همه با مستندات Swagger و تست.

