# Persian version of portfolio.yaml. Same structure; `site` values not set here come from ../portfolio.yaml.
name: افشین حسنی

site:
  title: افشین حسنی — سازندهٔ سیستم‌های پشت اپ‌های پرداخت و وام
  description: افشین حسنی سیستم‌های پشت صحنه‌ای را می‌سازد که مردم با آن‌ها پرداخت می‌کنند، وام می‌گیرند و قسطی خرید می‌کنند. بیش از ۶ سال تجربه در شرکت‌های فین‌تک.

hero:
  hello: سلام، من افشین هستم.
  lead: "من موتورِ پشتِ اپلیکیشن‌هایی را می‌سازم که مردم با آن‌ها "
  highlight: پرداخت می‌کنند، وام می‌گیرند و قسطی خرید می‌کنند.
  sub: شما دکمه‌های اپ را می‌بینید؛ من چیزی را می‌سازم که بعد از زدن آن دکمه‌ها اتفاق می‌افتد — بررسی موجودی، ارتباط با بانک، و اینکه هر ریال درست به مقصد برسد.
  facts:
    - value: بیش از ۶ سال
      label: تجربه در ساخت اپ‌های مالی
    - value: بیش از ۷٬۰۰۰
      label: فروشگاه از سیستم وامی که ساختم استفاده می‌کنند
    - value: کارشناسی ارشد
      label: مهندسی نرم‌افزار

explainer:
  heading: کار من، به زبان ساده
  analogy: "یک اپلیکیشن را مثل یک رستوران تصور کنید. صفحه‌ای که لمس می‌کنید سالن رستوران است. من در آشپزخانه کار می‌کنم — جایی که مشتری هیچ‌وقت نمی‌بیند، اما همان‌جاست که تعیین می‌کند سفارش درست به دستش برسد یا نه."
  items:
    - icon: pay
      title: پرداخت
      text: پول دقیقاً یک بار از جایی به جای دیگر می‌رود؛ نه گم می‌شود، نه دو بار کم می‌شود.
    - icon: loan
      title: وام و اقساط
      text: اینکه هر کس چقدر می‌تواند وام بگیرد، تقسیم آن به قسط‌های ماهانه، و پیگیری تک‌تک پرداخت‌ها.
    - icon: bank
      title: اتصال به بانک‌ها
      text: اپ به‌طور خودکار از بانک‌ها و سکوهای سرمایه‌گذاری استعلام می‌گیرد تا مشتری نه فرم پر کند و نه در صف بماند.

proof_points:
  - slug: carbon-collateral-credit
    title: وام بگیرید، بدون فروختن پس‌اندازتان
    companies: [Carbon OS]
    period: ۲۰۲۶ – اکنون
    role: کل سیستم اعتبار را از صفر تا صد طراحی کردم و ساختم.
    fact: "۴"
    fact_label: سکوی سرمایه‌گذاری متصل شده
    mockup: credit
  - slug: gsmpay-bnpl
    title: الان بخرید، ماهانه قسط بدهید
    companies: [GSMPay]
    period: ۲۰۲۴ – ۲۰۲۶
    role: هستهٔ اصلی فرایند وام را ساختم — درخواست، تأیید بانک، جدول اقساط و قرارداد.
    fact: بیش از ۷٬۰۰۰
    fact_label: فروشگاه همکار
    mockup: installments
  - slug: money-movement
    title: هیچ‌کس دو بار پول نمی‌دهد
    companies: [Carbon OS, GSMPay]
    period: ۲۰۲۴ – اکنون
    role: قوانین ایمنی‌ای را ساختم که هر دو شرکت برای پرداخت‌های کیف پول از آن استفاده می‌کنند.
    fact: فقط ۱ بار
    fact_label: هر پرداخت دقیقاً یک بار حساب می‌شود
    mockup: once

wins:
  - value: از دقیقه به ثانیه
    text: گزارش‌های کند را در Changino بازنویسی کردم تا به‌جای چند دقیقه، در چند ثانیه آماده شوند.
  - value: استفادهٔ هرروزه
    text: تیم‌های مالی و عملیات GSMPay هر روز از گزارش‌ها و خروجی‌های اکسلی که ساختم استفاده می‌کنند.
  - value: هشدار زودهنگام
    text: در Carbon، پیش از آنکه پولِ در دسترس برای وام کم شود، تیم در اسلک هشدار می‌گیرد.
  - value: بیش از ۴۰
    text: قابلیت پشت اپ‌های مشتری، فروشگاه و درگاه پرداخت GSMPay — همه مستند و تست‌شده.

companies:
  Carbon OS:
    name: Carbon
    url: https://carbon.ir
    position: مهندس نرم‌افزار ارشد
    note: اپ مالی برای کسب‌وکارهای کوچک — پرداخت، کیف پول و اعتبار.
  GSMPay:
    name: GSMPay
    url: https://gsmpay.ir
    position: توسعه‌دهندهٔ بک‌اند
    note: الان بخر، بعداً پرداخت کن؛ در بیش از ۷٬۰۰۰ فروشگاه همکار.
  Changino:
    name: Changino
    position: توسعه‌دهندهٔ بک‌اند
    note: وب‌اپ‌های پربازدید. گزارش‌های کند را سریع کردم.
  MihanService:
    name: MihanService
    position: توسعه‌دهندهٔ فول‌استک
    note: یک سیستم قدیمی را بازسازی کردم و سریع‌تر کردم.

