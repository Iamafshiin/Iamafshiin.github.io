name: Afshin Hasani

site:
  url: https://iamafshiin.github.io
  title: Afshin Hasani — I build the systems behind payment and lending apps
  description: Afshin Hasani builds the behind-the-scenes systems that let people pay, borrow and buy in installments — safely. 6+ years at fintech companies.
  resume_path: /afshin-hasani-resume.pdf
  linkedin: https://www.linkedin.com/in/afshin-hasani/
  github: https://github.com/Iamafshiin

hero:
  hello: Hi, I'm Afshin.
  lead: "I build the engine behind apps that let people "
  highlight: pay, borrow and buy in installments.
  sub: You see the app's buttons. I build what happens after you tap them — checking the balance, talking to the bank, and making sure every rial lands in the right place.
  facts:
    - value: 6+ years
      label: building money apps
    - value: 7,000+
      label: stores using my loan system
    - value: MSc
      label: in software engineering

explainer:
  heading: What I do, in plain words
  analogy: "Every app has two parts. The front end is the screens you see and tap. The back end is the servers and logic behind those screens. I build the back end — the part customers never see, but the part that decides whether their money and data end up in the right place."
  items:
    - icon: pay
      title: Payments
      text: Money goes from A to B exactly once — never lost, never charged twice.
    - icon: loan
      title: Loans & installments
      text: Work out how much someone can borrow, split it into monthly payments, and keep track of every payment.
    - icon: bank
      title: Connecting to banks
      text: The app checks things with banks and investment platforms automatically, so customers don't fill in forms or wait in line.

proof_points:
  - slug: carbon-collateral-credit
    fact: "4"
    fact_label: investment platforms connected
  - slug: gsmpay-bnpl
    fact: 7,000+
    fact_label: partner stores
  - slug: money-movement
    fact: 1×
    fact_label: every payment counted exactly once

wins:
  - value: Minutes → seconds
    text: Rebuilt slow business reports at Changino so they load in seconds instead of minutes.
  - value: Used daily
    text: The finance and operations teams at GSMPay use the reports and Excel exports I built every day.
  - value: Early warning
    text: At Carbon, the team gets a Slack alert before the money available for loans runs low.
  - value: 40+
    text: Features behind GSMPay's customer, store and payment apps — each one documented and tested.

