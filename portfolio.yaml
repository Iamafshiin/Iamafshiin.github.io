hero:
  hello: Hi, I'm Afshin.
  lead: "I build the engine behind apps that let people "
  highlight: pay, borrow and buy in installments.
  sub: You see the app's buttons. I build what happens after you tap them — checking the balance, talking to the bank, and making sure every rial lands in the right place.
  facts:
    - value: 6+ years
      label: building money apps
    - value: 7,000+
      label: stores using my loan system
    - value: MSc
      label: in software engineering

explainer:
  heading: What I do, in plain words
  analogy: "Think of an app like a restaurant. The screen you tap is the dining room. I work in the kitchen — the part customers never see, but the part that decides whether their order arrives right."
  items:
    - icon: pay
      title: Payments
      text: Money goes from A to B exactly once — never lost, never charged twice.
    - icon: loan
      title: Loans & installments
      text: Work out how much someone can borrow, split it into monthly payments, and keep track of every payment.
    - icon: bank
      title: Connecting to banks
      text: The app checks things with banks and investment platforms automatically, so customers don't fill in forms or wait in line.

